name: Vale lint

on:
  pull_request:
    paths:
      - '**/*.md'
      - '**/*.mdx'
  push:
    branches: [main]
    paths:
      - '**/*.md'
      - '**/*.mdx'
  workflow_dispatch: {}


jobs:
  vale:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run Vale
        uses: errata-ai/vale-action@v2
        with:
          reporter: github-pr-review
          fail_on_error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
