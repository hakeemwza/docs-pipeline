# Markdown linting rules
default: true

# MD003: Heading style consistency
MD003:
  style: "consistent"

# MD004: Unordered list style consistency
MD004:
  style: "consistent"

# MD007: Unordered list indentation (2 spaces)
MD007:
  indent: 2

# MD013: Line length
MD013:
  line_length: 120
  code_blocks: true
  code_block_line_length: 120

# MD033: Allow inline HTML (useful for documentation)
MD033: false

# MD041: First line doesn't need to be a heading
MD041: false